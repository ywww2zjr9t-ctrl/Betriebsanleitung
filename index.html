<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#fff8fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Betriebsanleitung">
  <title>Betriebsanleitung für einen vorübergehend anderweitig beschäftigten Kopf</title>
  <style>
    :root{
      --bg:#fff8fb;
      --ink:#173452;
      --accent:#e95f91;
      --muted:#8b7d87;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-right:env(safe-area-inset-right,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);touch-action:pan-y pinch-zoom}
    .app{position:fixed;inset:0;padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);overflow:hidden}
    .stage{position:absolute;inset:0;overflow:hidden;touch-action:pan-y pinch-zoom}
    .track{height:100%;display:flex;will-change:transform;transition:transform .34s cubic-bezier(.22,.61,.36,1)}
    .track.dragging{transition:none}
    .page{min-width:100%;height:100%;display:grid;place-items:center;padding:10px 10px 42px}
    .page img{
      display:block;
      max-width:100%;
      max-height:100%;
      width:auto;height:auto;
      object-fit:contain;
      border-radius:2px;
      box-shadow:0 8px 30px rgba(39,37,44,.10);
      user-select:none;-webkit-user-drag:none;
    }
    .nav{
      position:absolute;top:50%;transform:translateY(-50%);
      width:44px;height:64px;border:0;border-radius:22px;
      background:rgba(255,255,255,.78);color:var(--ink);
      font-size:32px;line-height:1;cursor:pointer;
      box-shadow:0 4px 18px rgba(0,0,0,.10);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      z-index:3;
    }
    .nav:disabled{opacity:0;pointer-events:none}
    .prev{left:max(8px,var(--safe-left))}
    .next{right:max(8px,var(--safe-right))}
    .footer{
      position:absolute;left:50%;bottom:max(8px,var(--safe-bottom));
      transform:translateX(-50%);z-index:4;
      display:flex;align-items:center;gap:10px;
      padding:7px 11px;border-radius:999px;
      background:rgba(255,255,255,.80);
      box-shadow:0 3px 16px rgba(0,0,0,.08);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      opacity:1;
      transition:opacity .35s ease;
    }
    .footer.hidden{opacity:0;pointer-events:none}
    .dots{display:flex;gap:6px;align-items:center}
    .dot{width:7px;height:7px;border:0;border-radius:50%;padding:0;background:#d8cbd1;cursor:pointer}
    .dot.active{background:var(--accent);transform:scale(1.25)}
    .count{font-size:12px;font-weight:650;min-width:31px;text-align:center;color:var(--muted)}
    .hint{
      position:absolute;left:50%;top:max(10px,var(--safe-top));transform:translateX(-50%);
      z-index:5;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.88);
      font-size:12px;color:var(--muted);box-shadow:0 2px 12px rgba(0,0,0,.06);
      transition:opacity .5s ease;pointer-events:none;white-space:nowrap
    }
    .hint.hide{opacity:0}
    @media (hover:none), (max-width:700px){
      .nav{display:none}
      .page{padding:4px 4px 38px}
      .page img{box-shadow:none}
    }
    @media (prefers-reduced-motion:reduce){.track{transition:none}}
  </style>
</head>
<body>
  <main class="app" aria-label="Betriebsanleitung">
    <div class="stage" id="stage">
      <div class="track" id="track"></div>
    </div>
    <button class="nav prev" id="prev" aria-label="Vorherige Seite">‹</button>
    <button class="nav next" id="next" aria-label="Nächste Seite">›</button>
    <div class="hint" id="hint">Wischen zum Blättern</div>
    <div class="footer" id="footer" aria-label="Seitennavigation">
      <div class="dots" id="dots"></div>
      <div class="count" id="count"></div>
    </div>
  </main>
<script>
const files = ["01-Deckblatt.jpg", "02-Regel 1A.jpg", "03-Regel 2.jpg", "04-Regel 3A.jpg", "05-Regel 4.jpg", "06-Regel 5.jpg", "07-Regel 6.jpg", "08-Regel 7.jpg", "09-Schlu├ƒ.jpg"];
const track = document.getElementById('track');
const dots = document.getElementById('dots');
const count = document.getElementById('count');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const stage = document.getElementById('stage');
const hint = document.getElementById('hint');
const footer = document.getElementById('footer');

let footerTimer;
function showFooter(){
  footer.classList.remove('hidden');
  clearTimeout(footerTimer);
  footerTimer = setTimeout(()=>footer.classList.add('hidden'),2500);
}
function hideFooter(){
  clearTimeout(footerTimer);
  footer.classList.add('hidden');
}

let index = 0, startX = 0, deltaX = 0, dragging = false, moved = false;

files.forEach((file,i)=>{
  const page=document.createElement('section');
  page.className='page';
  page.setAttribute('aria-label',`Seite ${i+1} von ${files.length}`);
  const img=document.createElement('img');
  img.src='pages/'+encodeURIComponent(file);
  img.alt=`Seite ${i+1} der Betriebsanleitung`;
  img.loading=i<2?'eager':'lazy';
  img.decoding='async';
  if(i===0) img.fetchPriority='high';
  page.appendChild(img); track.appendChild(page);

  const d=document.createElement('button');
  d.className='dot'; d.setAttribute('aria-label',`Zu Seite ${i+1}`);
  d.addEventListener('click',()=>go(i));
  dots.appendChild(d);
});

function render(){
  track.style.transform=`translate3d(${-index*100}%,0,0)`;
  [...dots.children].forEach((d,i)=>d.classList.toggle('active',i===index));
  count.textContent=`${index+1}/${files.length}`;
  prev.disabled=index===0; next.disabled=index===files.length-1;
  showFooter();
  // Preload adjacent pages.
  [index-1,index+1].forEach(i=>{
    if(i>=0 && i<files.length){
      const img=track.children[i].querySelector('img');
      if(!img.complete){ const p=new Image(); p.src=img.src; }
    }
  });
}
function go(i){ index=Math.max(0,Math.min(files.length-1,i)); render(); }
prev.onclick=()=>go(index-1); next.onclick=()=>go(index+1);

window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(index+1)}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(index-1)}
  if(e.key==='Home'){e.preventDefault();go(0)}
  if(e.key==='End'){e.preventDefault();go(files.length-1)}
});

stage.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse' && e.button!==0) return;
  dragging=true;moved=false;startX=e.clientX;deltaX=0;
  track.classList.add('dragging');
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!dragging)return;
  deltaX=e.clientX-startX;
  if(Math.abs(deltaX)>5)moved=true;
  const px=-index*stage.clientWidth+deltaX;
  track.style.transform=`translate3d(${px}px,0,0)`;
});
function finish(){
  if(!dragging)return;
  dragging=false;track.classList.remove('dragging');
  const threshold=Math.min(90,stage.clientWidth*.18);
  if(deltaX<-threshold) go(index+1);
  else if(deltaX>threshold) go(index-1);
  else render();
  if(moved) hint.classList.add('hide');
}
stage.addEventListener('pointerup',finish);
stage.addEventListener('pointercancel',finish);

stage.addEventListener('click',e=>{
  if(moved) return;
  if(e.target.closest('.footer,.nav')) return;
  if(footer.classList.contains('hidden')) showFooter();
  else hideFooter();
});


setTimeout(()=>hint.classList.add('hide'),3500);
render();
</script>
</body>
</html>
